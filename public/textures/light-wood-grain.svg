<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="woodBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfc7a5" />
      <stop offset="25%" stop-color="#d6ba94" />
      <stop offset="50%" stop-color="#e3cbab" />
      <stop offset="75%" stop-color="#ceb088" />
      <stop offset="100%" stop-color="#dec6a3" />
    </linearGradient>
    <pattern id="grainPattern" width="400" height="400" patternUnits="userSpaceOnUse">
      <rect width="400" height="400" fill="url(#woodBase)" />
      <!-- Subtle Wood Grain Lines -->
      <g stroke="#ba9b72" stroke-width="0.75" opacity="0.35" fill="none">
        <path d="M15,0 Q18,100 12,200 T18,400" />
        <path d="M45,0 Q40,120 48,250 T42,400" />
        <path d="M85,0 Q92,80 82,180 T90,400" />
        <path d="M125,0 Q118,150 128,300 T122,400" />
        <path d="M165,0 Q172,90 160,210 T168,400" />
        <path d="M210,0 Q205,140 215,260 T208,400" />
        <path d="M255,0 Q262,110 250,220 T258,400" />
        <path d="M300,0 Q292,130 305,270 T296,400" />
        <path d="M345,0 Q352,95 340,215 T348,400" />
        <path d="M385,0 Q380,160 388,290 T382,400" />
      </g>
      <!-- Subtle fine grain noise stripes -->
      <g stroke="#9e7c54" stroke-width="0.35" opacity="0.25" fill="none">
        <path d="M30,0 Q32,100 28,200 T32,400" />
        <path d="M70,0 Q68,120 74,250 T69,400" />
        <path d="M145,0 Q150,80 142,180 T148,400" />
        <path d="M188,0 Q182,150 190,300 T185,400" />
        <path d="M232,0 Q238,90 228,210 T235,400" />
        <path d="M280,0 Q276,140 284,260 T278,400" />
        <path d="M325,0 Q330,110 322,220 T328,400" />
        <path d="M365,0 Q360,130 370,270 T362,400" />
      </g>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#grainPattern)" />
</svg>
