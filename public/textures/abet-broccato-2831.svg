<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 3050" width="1300" height="3050">
  <defs>
    <!-- Rich Petroleum Teal Background Gradient -->
    <linearGradient id="broccatoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6B78" />
      <stop offset="50%" stop-color="#25606C" />
      <stop offset="100%" stop-color="#1E525C" />
    </linearGradient>

    <!-- Master Baroque Damask Broccato Motif (Symmetric at x=650) -->
    <g id="damaskUnit">
      <!-- 1. Central Core Medallion & Crown -->
      <path d="M650,120 C610,190 520,260 520,380 C520,490 590,570 650,640 C710,570 780,490 780,380 C780,260 690,190 650,120 Z" fill="#433B3C" />
      <path d="M650,170 C615,230 560,300 560,380 C560,450 610,510 650,560 C690,510 740,450 740,380 C740,300 685,230 650,170 Z" fill="#25606C" />
      <circle cx="650" cy="380" r="45" fill="#433B3C" />
      <circle cx="650" cy="380" r="22" fill="#25606C" />
      
      <!-- Top Fleur-de-lis Crest -->
      <path d="M650,40 C630,70 610,110 650,140 C690,110 670,70 650,40 Z" fill="#433B3C" />
      <path d="M605,80 C570,80 545,115 580,140 C605,130 620,105 605,80 Z" fill="#433B3C" />
      <path d="M695,80 C730,80 755,115 720,140 C695,130 680,105 695,80 Z" fill="#433B3C" />

      <!-- 2. Main Acanthus Flourishes & Side Volutes -->
      <!-- Left Acanthus Wing -->
      <path d="M520,320 C420,290 310,350 280,440 C250,530 310,620 400,610 C320,670 340,790 430,810 C510,830 560,750 540,680 C490,700 450,650 470,600 C490,550 540,540 570,580 C560,490 510,410 520,320 Z" fill="#433B3C" />
      <circle cx="360" cy="490" r="35" fill="#25606C" />
      <circle cx="430" cy="710" r="28" fill="#25606C" />

      <!-- Right Acanthus Wing (Mirrored) -->
      <path d="M780,320 C880,290 990,350 1020,440 C1050,530 990,620 900,610 C980,670 960,790 870,810 C790,830 740,750 760,680 C810,700 850,650 830,600 C810,550 760,540 730,580 C740,490 790,410 780,320 Z" fill="#433B3C" />
      <circle cx="940" cy="490" r="35" fill="#25606C" />
      <circle cx="870" cy="710" r="28" fill="#25606C" />

      <!-- 3. Lower Teardrop Pendant & Swag -->
      <path d="M650,670 C590,750 520,830 520,930 C520,1030 590,1090 650,1130 C710,1090 780,1030 780,930 C780,830 710,750 650,670 Z" fill="#433B3C" />
      <circle cx="650" cy="930" r="42" fill="#25606C" />
      <circle cx="650" cy="930" r="18" fill="#433B3C" />

      <!-- 4. Interlocking Baroque Ribbon Arch & Corner Scrolls -->
      <!-- Left Outrigger -->
      <path d="M250,560 C180,510 100,550 80,630 C60,710 120,780 190,770 C130,820 150,920 230,940 C300,960 340,900 320,840 C270,850 240,800 270,750 C290,710 330,710 350,740 C330,660 290,610 250,560 Z" fill="#433B3C" />
      <circle cx="160" cy="670" r="28" fill="#25606C" />
      
      <!-- Right Outrigger -->
      <path d="M1050,560 C1120,510 1200,550 1220,630 C1240,710 1180,780 1110,770 C1170,820 1150,920 1070,940 C1000,960 960,900 980,840 C1030,850 1060,800 1030,750 C1010,710 970,710 950,740 C970,660 1010,610 1050,560 Z" fill="#433B3C" />
      <circle cx="1140" cy="670" r="28" fill="#25606C" />

      <!-- Bottom Symmetrical Swag Arch -->
      <path d="M650,1140 C540,1140 440,1060 350,1110 C260,1160 240,1280 320,1340 C400,1390 510,1340 540,1260 C580,1270 620,1270 650,1270 C680,1270 720,1270 760,1260 C790,1340 900,1390 980,1340 C1060,1280 1040,1160 950,1110 C860,1060 760,1140 650,1140 Z" fill="#433B3C" />
      <circle cx="330" cy="1230" r="32" fill="#25606C" />
      <circle cx="970" cy="1230" r="32" fill="#25606C" />

      <!-- Secondary Mini Crests at Left & Right Edges (Seamless Repeat) -->
      <path d="M0,280 C50,280 100,340 100,430 C100,520 50,580 0,630 Z" fill="#433B3C" />
      <circle cx="30" cy="430" r="25" fill="#25606C" />
      <path d="M1300,280 C1250,280 1200,340 1200,430 C1200,520 1250,580 1300,630 Z" fill="#433B3C" />
      <circle cx="1270" cy="430" r="25" fill="#25606C" />
    </g>
  </defs>

  <!-- Solid Sheet Canvas 1300 x 3050 (130 x 305 cm) -->
  <rect width="1300" height="3050" fill="url(#broccatoBg)" />

  <!-- 2 Symmetrical Vertical Repeats across the 305 cm sheet -->
  <g transform="translate(0, 0)">
    <use href="#damaskUnit" />
  </g>
  <g transform="translate(0, 1525)">
    <use href="#damaskUnit" />
  </g>

  <!-- Wraps for Seamless Vertical Continuity -->
  <g transform="translate(0, -1525)">
    <use href="#damaskUnit" />
  </g>
  <g transform="translate(0, 3050)">
    <use href="#damaskUnit" />
  </g>
</svg>
